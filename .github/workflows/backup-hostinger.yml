name: Backup Hostinger (encrypted, off-site)

# Daily database dump and weekly full copy (database + shared .env + student documents),
# encrypted on the server with BACKUP_PASSPHRASE before anything leaves it, then kept as a
# GitHub Actions artifact. Artifacts count towards the repository's storage quota, so the
# retention is deliberately short; Hostinger's own backups stay on as the second line.
on:
  schedule:
    - cron: '50 2 * * *'   # daily db   (UTC)
    - cron: '20 3 * * 0'   # weekly full on Sundays
  workflow_dispatch:
    inputs:
      target:
        description: Target
        type: choice
        options: [production, staging]
        default: production
      scope:
        description: Scope
        type: choice
        options: [db, full, site]
        default: db
      site_docroot:
        description: 'scope=site only: the folder the domain serves today (from the inspection report), e.g. ~/domains/studymedicineuknigeria.com/public_html'
        required: false

permissions:
  contents: read

concurrency:
  group: backup-hostinger
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # No deployment environment: production's required reviewer would hold every scheduled backup for approval.
    # The SSH key and BACKUP_PASSPHRASE are repository secrets.
    services:
      # throwaway database for the restore test (never connected to the server)
      restore:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: restore, MARIADB_DATABASE: restore_test }
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TARGET: ${{ github.event.inputs.target || 'production' }}
      # scheduled: Sunday 03:20 run is the full copy, every other schedule is db-only
      SCOPE: ${{ github.event.inputs.scope || (github.event.schedule == '20 3 * * 0' && 'full' || 'db') }}
      HOST: ${{ vars.HOSTINGER_SSH_HOST }}
      PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
      USER: ${{ vars.HOSTINGER_SSH_USER }}
      SITE_DOCROOT: ${{ github.event.inputs.site_docroot }}
    steps:
      - uses: actions/checkout@v7
      - name: Check configuration
        id: cfg
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing HOSTINGER_SSH_HOST(variable)"
          [ -z "$USER" ] && missing="$missing HOSTINGER_SSH_USER(variable)"
          [ -z "$KEY" ]  && missing="$missing HOSTINGER_SSH_KEY(secret)"
          [ -z "$PASSPHRASE" ] && missing="$missing BACKUP_PASSPHRASE(secret)"
          if [ -n "$missing" ]; then
            # Before launch the nightly schedule has nothing to back up: skip quietly instead of failing every night.
            if [ "${{ github.event_name }}" = schedule ]; then echo "::notice::Backup skipped: server settings not configured yet ($missing)"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::error::Missing repository settings:$missing. Add them under Settings → Secrets and variables → Actions."; exit 1
          fi
          if [ "$SCOPE" = site ] && [ -z "$SITE_DOCROOT" ]; then echo "::error::scope=site needs site_docroot (the folder the domain serves today)"; exit 1; fi
          echo "target=$TARGET scope=$SCOPE"
      - name: Prepare SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_hostinger && chmod 600 ~/.ssh/id_hostinger
          # Pin the server key when HOSTINGER_SSH_KNOWN_HOSTS is set (recommended); otherwise trust on first use.
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; echo "SSH_STRICT=yes" >> "$GITHUB_ENV"; else ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || echo "::warning::ssh-keyscan failed; will accept host key on first connect"; fi
      - name: Create encrypted backup on the server
        id: make
        if: steps.cfg.outputs.skip != 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # The passphrase is the first stdin line (read by the remote shell into a variable), the script follows;
          # it is never on a command line, in a file, or in the log.
          { printf '%s\n' "$BACKUP_PASSPHRASE"; printf 'SITE_DOCROOT=%q\n' "$SITE_DOCROOT"; cat ops/backup.sh; } | \
            ssh -i ~/.ssh/id_hostinger -o StrictHostKeyChecking=${SSH_STRICT:-accept-new} -o ConnectTimeout=20 -p "$PORT" "$USER@$HOST" \
            "read -r BACKUP_PASSPHRASE && export BACKUP_PASSPHRASE && TARGET='$TARGET' SCOPE='$SCOPE' bash -s" 2>&1 | tee server.log || true
          if ! grep -q '^backup=' server.log; then
            # scheduled run before the target is bootstrapped: nothing exists yet to back up
            if [ "${{ github.event_name }}" = schedule ] && grep -q 'is not bootstrapped' server.log; then echo "::notice::Backup skipped: $TARGET is not bootstrapped yet"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::error::backup did not report an output file"; exit 1
          fi
          echo "FILE=$(grep '^backup=' server.log | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Fetch to runner and verify checksum
        if: steps.cfg.outputs.skip != 'true' && steps.make.outputs.skip != 'true'
        run: |
          mkdir -p out
          scp -i ~/.ssh/id_hostinger -o StrictHostKeyChecking=${SSH_STRICT:-accept-new} -P "$PORT" "$USER@$HOST:$FILE" "$USER@$HOST:$FILE.sha256" out/
          (cd out && sha256sum -c "$(basename "$FILE").sha256")
          size=$(stat -c %s "out/$(basename "$FILE")")
          echo "size_bytes=$size"
          if [ "$size" -gt 419430400 ]; then echo "::warning::backup is larger than 400 MB; review artifact storage quota (Settings → Billing) before relying on daily uploads"; fi
          # encrypted payload must not be readable without the passphrase
          ! tar -tf "out/$(basename "$FILE")" >/dev/null 2>&1
      - name: Restore test (decrypt on the runner, load into a throwaway database)
        if: steps.cfg.outputs.skip != 'true' && steps.make.outputs.skip != 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Proves the backup can be decrypted with the passphrase and restored, not only that it was copied intact.
          # The decrypted copy lives only in this job's temp directory and is deleted at the end of the step.
          T=$(mktemp -d); trap 'rm -rf "$T"' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in "out/$(basename "$FILE")" | tar -xf - -C "$T"
          DUMP=$(find "$T" -name 'database.sql.gz' | head -1)
          if [ "$SCOPE" = site ]; then
            # the existing site before launch: every file must list from the archive; a WordPress database must load
            FILES=$(tar -tzf "$(find "$T" -name site-files.tgz | head -1)" | wc -l); [ "$FILES" -gt 0 ] || { echo "::error::site archive is empty"; exit 1; }
            tables=0
            if [ -n "$DUMP" ]; then
              gzip -dc "$DUMP" | tail -1 | grep -q 'Dump completed' || { echo "::error::site database dump is incomplete"; exit 1; }
              gzip -dc "$DUMP" | mysql -h 127.0.0.1 -uroot -prestore restore_test
              tables=$(mysql -N -h 127.0.0.1 -uroot -prestore -e "select count(*) from information_schema.tables where table_schema='restore_test'")
            fi
            echo "### Pre-launch site backup restored: $FILES files, $tables database tables" >> "$GITHUB_STEP_SUMMARY"
            echo "restore test passed: $FILES files, $tables tables"; exit 0
          fi
          [ -n "$DUMP" ] || { echo "::error::no database dump inside the backup"; exit 1; }
          gzip -t "$DUMP" && gzip -dc "$DUMP" | tail -1 | grep -q 'Dump completed' || { echo "::error::database dump is incomplete"; exit 1; }
          gzip -dc "$DUMP" | mysql -h 127.0.0.1 -uroot -prestore restore_test
          tables=$(mysql -N -h 127.0.0.1 -uroot -prestore -e "select count(*) from information_schema.tables where table_schema='restore_test'")
          for t in migrations users applications reference_facts universities; do
            mysql -N -h 127.0.0.1 -uroot -prestore restore_test -e "select 1 from $t limit 1" >/dev/null || { echo "::error::table $t missing after restore"; exit 1; }
          done
          facts=$(mysql -N -h 127.0.0.1 -uroot -prestore restore_test -e "select count(*) from reference_facts")
          [ "$SCOPE" = full ] && { [ -s "$(find "$T" -name shared.env | head -1)" ] || { echo "::error::full backup has no shared.env"; exit 1; }; }
          echo "restore test passed: $tables tables, $facts reference facts"
          echo "### Restore test passed: $tables tables, $facts reference facts" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.cfg.outputs.skip != 'true' && steps.make.outputs.skip != 'true'
        with:
          name: smukn-${{ env.TARGET }}-${{ env.SCOPE }}-${{ github.run_id }}
          path: out/
          retention-days: ${{ env.SCOPE == 'site' && 30 || (env.SCOPE == 'full' && 28 || 14) }}
          if-no-files-found: error
