name: Bootstrap Hostinger target (one-time)
# Prepares ~/apps/smukn-<target> on the server: shared/.env (APP_KEY generated on the server), storage dirs, cron.
# Does NOT touch the document root unless link_docroot=true (then backs it up first). Run after reviewing the inspection report.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      app_url:
        description: 'Public URL for this target (e.g. https://staging.studymedicineuknigeria.com)'
        required: true
      link_docroot:
        description: 'Replace the document root with a symlink to current/public (backs up the existing one first)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      docroot:
        description: 'Document root path on the server (required if link_docroot=true), e.g. ~/domains/staging.studymedicineuknigeria.com/public_html'
        required: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Check configuration
        env:
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          DBN: ${{ secrets.SMUKN_DB_DATABASE }}
          DBU: ${{ secrets.SMUKN_DB_USERNAME }}
          DBP: ${{ secrets.SMUKN_DB_PASSWORD }}
          SBU: ${{ vars.STAGING_BASIC_USER }}
          SBP: ${{ secrets.STAGING_BASIC_PASSWORD }}
        run: |
          m=""; [ -z "$HOST" ] && m="$m HOSTINGER_SSH_HOST"; [ -z "$USER" ] && m="$m HOSTINGER_SSH_USER"; [ -z "$KEY" ] && m="$m HOSTINGER_SSH_KEY"
          [ -z "$DBN" ] && m="$m SMUKN_DB_DATABASE"; [ -z "$DBU" ] && m="$m SMUKN_DB_USERNAME"; [ -z "$DBP" ] && m="$m SMUKN_DB_PASSWORD"
          if [ "${{ github.event.inputs.target }}" = staging ]; then [ -z "$SBU" ] && m="$m STAGING_BASIC_USER(variable)"; [ -z "$SBP" ] && m="$m STAGING_BASIC_PASSWORD(secret)"; fi
          [ -n "$m" ] && { echo "::error::Missing:$m (environment '${{ github.event.inputs.target }}' secrets/variables)"; exit 1; }; true
      - name: Prepare SSH
        env: { KEY: "${{ secrets.HOSTINGER_SSH_KEY }}", HOST: "${{ vars.HOSTINGER_SSH_HOST }}", PORT: "${{ vars.HOSTINGER_SSH_PORT || '65002' }}", KNOWN_HOSTS: "${{ vars.HOSTINGER_SSH_KNOWN_HOSTS }}" }
        run: |
          install -d -m 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/id_hostinger; chmod 600 ~/.ssh/id_hostinger
          # Pin the server key when HOSTINGER_SSH_KNOWN_HOSTS is set (recommended); otherwise trust on first use.
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; echo "SSH_STRICT=yes" >> "$GITHUB_ENV"; else ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
      - name: Run bootstrap on server
        env:
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
          TARGET: ${{ github.event.inputs.target }}
          APP_URL: ${{ github.event.inputs.app_url }}
          LINK_DOCROOT: ${{ github.event.inputs.link_docroot == 'true' && '1' || '0' }}
          DOCROOT: ${{ github.event.inputs.docroot }}
          DB_DATABASE: ${{ secrets.SMUKN_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.SMUKN_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.SMUKN_DB_PASSWORD }}
          DB_HOST: ${{ vars.SMUKN_DB_HOST || '127.0.0.1' }}
          MAIL_PASSWORD: ${{ secrets.SMUKN_MAIL_PASSWORD }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SITE_WHATSAPP: ${{ vars.SITE_WHATSAPP }}
          SITE_LEGAL_NAME: ${{ vars.SITE_LEGAL_NAME }}
          STAGING_BASIC_USER: ${{ vars.STAGING_BASIC_USER }}
          STAGING_BASIC_PASSWORD: ${{ secrets.STAGING_BASIC_PASSWORD }}
        run: |
          # Values travel on stdin as bash-quoted exports ahead of the script, never on the remote command line
          # (where they would appear in the server's process list and break on quotes).
          { for v in TARGET APP_URL LINK_DOCROOT DOCROOT DB_DATABASE DB_USERNAME DB_PASSWORD DB_HOST MAIL_PASSWORD STRIPE_KEY STRIPE_SECRET STRIPE_WEBHOOK_SECRET SITE_WHATSAPP SITE_LEGAL_NAME STAGING_BASIC_USER STAGING_BASIC_PASSWORD; do
              printf 'export %s=%q\n' "$v" "${!v}"; done
            cat ops/server-bootstrap.sh; } | \
            ssh -i ~/.ssh/id_hostinger -o StrictHostKeyChecking=${SSH_STRICT:-accept-new} -o ConnectTimeout=20 -p "$PORT" "$USER@$HOST" 'bash -s'
