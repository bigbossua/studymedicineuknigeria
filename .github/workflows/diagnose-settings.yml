name: Diagnose Actions settings

# Reports which settings the staging path needs are visible at repository level and inside each deployment
# environment, and whether production is protected by a required reviewer. Prints only PRESENT / missing and
# lengths, never a value. The production job waits for approval once a reviewer is set; that wait is itself the
# proof that the approval rule works (approve or cancel it).
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repository-level:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report
        env:
          V_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          V_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          V_USER: ${{ vars.HOSTINGER_SSH_USER }}
          V_KNOWN_HOSTS: ${{ vars.HOSTINGER_SSH_KNOWN_HOSTS }}
          V_STAGING_URL: ${{ vars.STAGING_URL }}
          V_STAGING_BASIC_USER: ${{ vars.STAGING_BASIC_USER }}
          V_DB_HOST: ${{ vars.SMUKN_DB_HOST }}
          S_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          S_BACKUP: ${{ secrets.BACKUP_PASSPHRASE }}
          S_STAGING_BASIC_PASSWORD: ${{ secrets.STAGING_BASIC_PASSWORD }}
          S_DB_DATABASE: ${{ secrets.SMUKN_DB_DATABASE }}
          S_DB_USERNAME: ${{ secrets.SMUKN_DB_USERNAME }}
          S_DB_PASSWORD: ${{ secrets.SMUKN_DB_PASSWORD }}
          S_MAIL: ${{ secrets.SMUKN_MAIL_PASSWORD }}
          S_STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
        run: |
          echo "scope: repository (no environment)"
          for n in V_HOST V_PORT V_USER V_KNOWN_HOSTS V_STAGING_URL V_STAGING_BASIC_USER V_DB_HOST S_KEY S_BACKUP S_STAGING_BASIC_PASSWORD S_DB_DATABASE S_DB_USERNAME S_DB_PASSWORD S_MAIL S_STRIPE_SECRET; do
            v="${!n}"; if [ -n "$v" ]; then echo "$n: PRESENT (length ${#v})"; else echo "$n: missing"; fi
          done
          # shape hints without revealing content
          [ -n "$S_KEY" ] && { echo "S_KEY first line: $(printf '%s' "$S_KEY" | head -1 | sed -E 's/[A-Za-z0-9+\/=]{8,}/…/g')"; echo "S_KEY lines: $(printf '%s\n' "$S_KEY" | wc -l)"; }
          [ -n "$V_PORT" ] && echo "V_PORT numeric: $([[ "$V_PORT" =~ ^[0-9]+$ ]] && echo yes || echo no)"
          [ -n "$V_STAGING_URL" ] && echo "V_STAGING_URL https: $([[ "$V_STAGING_URL" =~ ^https:// ]] && echo yes || echo no)"
          [ -n "$V_KNOWN_HOSTS" ] && echo "V_KNOWN_HOSTS lines: $(printf '%s\n' "$V_KNOWN_HOSTS" | grep -c .)"
          true
  environments:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Protection rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/environments" --jq '.environments[] | "\(.name): \([.protection_rules[]?.type] | if length == 0 then "no protection rules" else join(", ") end)"' || echo "could not read environments"
          n=$(gh api "repos/${{ github.repository }}/environments/production" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -ge 1 ]; then echo "production required reviewer: PRESENT"; else echo "production required reviewer: missing (production deploys refuse to run until it is set)"; fi
  environment-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - name: Report
        env:
          V_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          V_USER: ${{ vars.HOSTINGER_SSH_USER }}
          V_STAGING_URL: ${{ vars.STAGING_URL }}
          V_STAGING_BASIC_USER: ${{ vars.STAGING_BASIC_USER }}
          S_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          S_STAGING_BASIC_PASSWORD: ${{ secrets.STAGING_BASIC_PASSWORD }}
          S_DB_DATABASE: ${{ secrets.SMUKN_DB_DATABASE }}
          S_DB_USERNAME: ${{ secrets.SMUKN_DB_USERNAME }}
          S_DB_PASSWORD: ${{ secrets.SMUKN_DB_PASSWORD }}
          S_STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          S_STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          S_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          echo "scope: environment staging (what bootstrap and deploy of staging can see)"
          for n in V_HOST V_USER V_STAGING_URL V_STAGING_BASIC_USER S_KEY S_STAGING_BASIC_PASSWORD S_DB_DATABASE S_DB_USERNAME S_DB_PASSWORD S_STRIPE_KEY S_STRIPE_SECRET S_STRIPE_WEBHOOK_SECRET; do v="${!n}"; if [ -n "$v" ]; then echo "$n: PRESENT (length ${#v})"; else echo "$n: missing"; fi; done
          # only the mode is reported (staging refuses live keys), never any part of the value
          for n in S_STRIPE_KEY S_STRIPE_SECRET; do v="${!n}"; [ -n "$v" ] || continue; case "$v" in pk_test_*|sk_test_*|rk_test_*) echo "$n mode: test";; *) echo "$n mode: NOT TEST (staging refuses it)";; esac; done
  environment-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Report
        env:
          V_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          V_USER: ${{ vars.HOSTINGER_SSH_USER }}
          S_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          S_DB_DATABASE: ${{ secrets.SMUKN_DB_DATABASE }}
          S_DB_USERNAME: ${{ secrets.SMUKN_DB_USERNAME }}
          S_DB_PASSWORD: ${{ secrets.SMUKN_DB_PASSWORD }}
          S_MAIL: ${{ secrets.SMUKN_MAIL_PASSWORD }}
          S_STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          S_STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          S_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          echo "scope: environment production (this job only starts after approval when a reviewer is set)"
          for n in V_HOST V_USER S_KEY S_DB_DATABASE S_DB_USERNAME S_DB_PASSWORD S_MAIL S_STRIPE_KEY S_STRIPE_SECRET S_STRIPE_WEBHOOK_SECRET; do v="${!n}"; if [ -n "$v" ]; then echo "$n: PRESENT (length ${#v})"; else echo "$n: missing"; fi; done
          # only the mode is reported (production deploys and settings refuse test keys), never any part of the value
          for n in S_STRIPE_KEY S_STRIPE_SECRET; do v="${!n}"; [ -n "$v" ] || continue; case "$v" in pk_live_*|sk_live_*|rk_live_*) echo "$n mode: live";; *) echo "$n mode: NOT LIVE (production refuses it)";; esac; done
