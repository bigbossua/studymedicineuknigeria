name: Live verification (read-only)
# After a launch or release: ops/live-verify.sh against the public site (every old URL, no fee or debug text on any
# public page, canonicals, JSON-LD, registration and sign-in, portal and admin protection, foreign hosts, headers),
# then the server's own state over SSH: settings that keep payment closed, migrations, and what the database holds.
# Reads only; values of secrets are never printed.
on:
  schedule:
    - cron: '23 6 * * *'   # daily: payments are live, so the scheduled run checks the open state
  workflow_dispatch:
    inputs:
      payments:
        description: 'Expected payment state: closed, or open (live Stripe wired: live key, webhook secret, catalogue in step)'
        required: true
        default: closed
        type: choice
        options: [closed, open]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ vars.HOSTINGER_SSH_HOST }}
      PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
      USER: ${{ vars.HOSTINGER_SSH_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Public site
        run: |
          ops/live-verify.sh https://studymedicineuknigeria.com | tee live.txt; test "${PIPESTATUS[0]}" = 0
          { echo '### Live site'; echo '```'; cat live.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Google-readiness audit (robots, sitemap, canonicals, structured data, variants, private URLs, weight)
        if: always()
        run: |
          python3 ops/seo/google-audit.py https://studymedicineuknigeria.com --json google-audit.json | tee google.txt; test "${PIPESTATUS[0]}" = 0
          { echo '### Google readiness'; echo '```'; grep -v '^PASS  page' google.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Searcher's journey (phone and desktop, read-only, stops at the registration form)
        if: always()
        run: |
          npm i -g playwright@1 >/dev/null 2>&1 && npx -y playwright@1 install --with-deps chromium >/dev/null 2>&1
          mkdir -p journey; rc=0
          for v in phone desktop; do node ops/qa/public-journey.cjs journey https://studymedicineuknigeria.com "$([ $v = desktop ] && echo desktop)" > "journey/$v.json" || rc=1; done
          { echo '### Journey'; echo '```'; cat journey/*.json | grep -E '"(step|url|problems)"|HTTP|expected|fee|no visible' ; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat journey/*.json; exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: google-audit-${{ github.run_id }}
          path: |
            google-audit.json
            journey/
          retention-days: 90
      - name: Prepare SSH
        if: always()
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/id_hostinger; chmod 600 ~/.ssh/id_hostinger
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; echo "SSH_STRICT=yes" >> "$GITHUB_ENV"; else ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
      - name: Server state (payment closed, migrations, database)
        if: always()
        run: |
          cat <<'REMOTE' | ssh -i ~/.ssh/id_hostinger -o StrictHostKeyChecking=${SSH_STRICT:-accept-new} -o ConnectTimeout=20 -p "$PORT" "$USER@$HOST" 'bash -s' | tee server.txt
          set -euo pipefail
          cd ~/apps/smukn-production/current
          PHP=""; for c in php83 php8.3 /opt/alt/php83/usr/bin/php php; do p=$(command -v "$c" 2>/dev/null) && "$p" -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);' && { PHP=$p; break; }; done
          echo "release: $(basename "$(readlink -f .)")"
          echo "document root: $(cat ~/apps/smukn-production/releases/.docroot 2>/dev/null)"; D=$(cat ~/apps/smukn-production/releases/.docroot); [ -f "$D/.smukn-docroot" ] && [ ! -L "$D" ] && echo "document root is a published folder: $(grep -o "releases/[^/]*/vendor" "$D/index.php" | cut -d/ -f2)"
          $PHP artisan migrate:status --no-ansi | grep -c 'Pending' | sed 's/^/pending migrations: /' || true
          $PHP artisan tinker --execute '
            $s = app(App\Services\Payments\StripeService::class);
            echo json_encode([
              "env" => app()->environment(), "debug" => config("app.debug"), "url" => config("app.url"),
              "registration_open" => config("site.registration_open"), "bank_transfer" => config("site.bank_transfer"),
              "publish_unverified" => config("site.publish_unverified"), "stripe_enabled" => $s->enabled(), "payments_open" => $s->paymentsOpen(),
              "mailer" => config("mail.default"),
              "universities" => App\Models\University::count(), "courses" => App\Models\Course::count(),
              "facts" => App\Models\ReferenceFact::count(), "redirects" => DB::table("redirects")->count(),
              "users" => App\Models\User::count(), "applications" => App\Models\Application::count(),
              "tier_prices" => App\Models\TierPrice::count(),
              "stripe_live_key" => str_starts_with((string) config("services.stripe.secret"), "sk_live_") || str_starts_with((string) config("services.stripe.secret"), "rk_live_"),
              "webhook_secret_set" => filled(config("services.stripe.webhook_secret")),
              "ga4_id_set" => filled(config("site.ga4_id")), "ga4_api_secret_set" => filled(config("site.ga4_api_secret")),
              "session_secure_cookie" => (bool) config("session.secure"), "session_http_only" => (bool) config("session.http_only"),
              "session_same_site" => config("session.same_site"), "app_key_set" => filled(config("app.key")),
              "public_storage_link" => file_exists(public_path("storage")),
              "queue_pending" => DB::table("jobs")->count(),
              "queue_oldest_pending_minutes" => ($t = DB::table("jobs")->min("created_at")) ? (int) round((time() - $t) / 60) : 0,
              "failed_jobs" => DB::table("failed_jobs")->count(), "image_reencode_gd" => function_exists("imagecreatefromstring"), "retention_last_run" => (Cache::get("retention.last_run")["at"] ?? null), "deletion_requests_open" => DB::table("users")->whereNotNull("deletion_requested_at")->whereNull("erased_at")->count(),
              "scheduler_heartbeat_minutes" => ($b = Cache::get("scheduler.heartbeat")) ? (int) floor((time() - (int) $b) / 60) : null,
            ], JSON_PRETTY_PRINT), PHP_EOL;'
          # what Stripe shows customers (Checkout, receipts, card statements): yes/no only, never the values (public logs)
          $PHP artisan tinker --execute '
            $s = app(App\Services\Payments\StripeService::class);
            if (! $s->enabled()) { echo "stripe account: no key installed", PHP_EOL; return; }
            $a = $s->client()->accounts->retrieve();
            $has = fn ($v) => $v !== null && $v !== "";
            $brand = fn ($v) => (bool) preg_match("/study\s*med/i", (string) $v);
            echo json_encode([
              "stripe_charges_enabled" => (bool) $a->charges_enabled,
              "customer_facing_name_is_brand" => $brand($a->business_profile->name ?? null) || $brand($a->settings->dashboard->display_name ?? null),
              "statement_descriptor_is_brand" => $brand($a->settings->payments->statement_descriptor ?? null),
              "support_address_published" => $has($a->business_profile->support_address->line1 ?? null),
              "support_phone_published" => $has($a->business_profile->support_phone ?? null),
              "support_email_set" => $has($a->business_profile->support_email ?? null),
            ], JSON_PRETTY_PRINT), PHP_EOL;'
          # accounts and the journey, as counts only (no names, emails or application numbers: public logs)
          $PHP artisan tinker --execute '
            $staff = App\Models\User::whereIn("role", ["admin", "staff"])->get();
            echo json_encode([
              "admins" => $staff->where("role", "admin")->count(), "staff" => $staff->where("role", "staff")->count(),
              "staff_and_admins_email_verified" => $staff->whereNotNull("email_verified_at")->count(),
              "staff_and_admins_with_two_step" => $staff->filter->hasTwoFactorEnabled()->count(),
              "students" => App\Models\User::where("role", "student")->count(),
              "applications_by_stage" => App\Models\Application::selectRaw("stage, count(*) n")->groupBy("stage")->pluck("n", "stage"),
              "documents_by_status" => DB::table("documents")->selectRaw("status, count(*) n")->groupBy("status")->pluck("n", "status"),
              "payments_by_status" => App\Models\Payment::selectRaw("status, count(*) n")->groupBy("status")->pluck("n", "status"),
              "submissions_by_status" => App\Models\Submission::selectRaw("status, count(*) n")->groupBy("status")->pluck("n", "status"),
              "stripe_events" => App\Models\StripeEvent::selectRaw("type, count(*) n, sum(processed_at is not null) processed")->groupBy("type")->get()->mapWithKeys(fn ($r) => [$r->type => $r->processed."/".$r->n]),
            ], JSON_PRETTY_PRINT), PHP_EOL;'
          # a signed event through the public URL must be accepted (200) and a forged one refused (400)
          if $PHP artisan tinker --execute 'echo filled(config("services.stripe.webhook_secret")) ? "yes" : "no";' | grep -q yes; then $PHP artisan smukn:stripe-webhook --self-test; fi
          # the live catalogue (ids and amounts only) must match the approved fees whenever a key is installed
          if $PHP artisan tinker --execute 'echo app(App\Services\Payments\StripeService::class)->enabled() ? "yes" : "no";' | grep -q yes; then $PHP artisan smukn:stripe-sync --check; fi
          REMOTE
          # unsigned webhook: 400 = signature checked (secret installed), 503 = no secret installed
          echo "webhook endpoint, unsigned POST: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://studymedicineuknigeria.com/webhooks/stripe)" | tee -a server.txt
          if [ "${{ github.event.inputs.payments || 'open' }}" = open ]; then
            for k in '"payments_open": true' '"stripe_enabled": true' '"stripe_live_key": true' '"webhook_secret_set": true' 'unsigned POST: 400' 'Webhook self-test passed' '"stripe_charges_enabled": true'; do grep -q "$k" server.txt || { echo "::error::live payments not fully wired: missing $k"; exit 1; }; done
          else
            grep -q '"payments_open": false' server.txt || { echo "::error::payment is not closed"; exit 1; }
          fi
          grep -q '"debug": false' server.txt || { echo "::error::debug is not off"; exit 1; }
          grep -q '"public_storage_link": false' server.txt || { echo "::error::a public storage link exists"; exit 1; }
          grep -q '"session_http_only": true' server.txt || { echo "::error::session cookie is readable by scripts"; exit 1; }
          grep -q '"session_secure_cookie": true' server.txt || { echo "::error::session cookie is not marked Secure"; exit 1; }
          # the queue worker runs from the hPanel cron job (schedule:run every minute): nothing may wait longer than 10 minutes
          grep -q '"failed_jobs": 0' server.txt || { echo "::error::failed queue jobs exist: open Admin, or run the mail diagnosis"; exit 1; }
          grep -q '"image_reencode_gd": true' server.txt || { echo "::error::PHP gd is missing on the server: photo uploads are refused until it is enabled (hPanel → PHP extensions)"; exit 1; }
          hb=$(grep -o '"scheduler_heartbeat_minutes": [0-9]*' server.txt | grep -o '[0-9]*$'); if [ -n "$hb" ] && [ "$hb" -gt 5 ]; then echo "::error::the scheduler last ran ${hb} minutes ago: the hPanel cron job has stopped"; exit 1; fi
          w=$(grep -o '"queue_oldest_pending_minutes": [0-9]*' server.txt | grep -o '[0-9]*$'); [ "${w:-0}" -le 10 ] || { echo "::error::queued emails have waited ${w} minutes: the scheduler cron job is not running (hPanel → Advanced → Cron Jobs)"; exit 1; }
          { echo '### Server state'; echo '```'; cat server.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
