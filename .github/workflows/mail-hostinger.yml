name: Send test email (Hostinger)
# Sends one real message from the server's mailbox (info@studymedicineuknigeria.com) through the configured SMTP, so
# verification and password-reset emails are proven to leave the server before students can register. With
# registration=open it then opens student registration, but only when the message was accepted AND the domain's
# email DNS (one SPF record, DMARC, MX) checks out; registration=close closes it again. Production needs its reviewer.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target'
        required: true
        default: production
        type: choice
        options: [staging, production]
      to:
        description: 'Send the test message to (an inbox you can check)'
        required: true
      registration:
        description: 'Student registration afterwards'
        required: true
        default: unchanged
        type: choice
        options: [unchanged, open, close]

permissions:
  contents: read

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Check inputs and configuration
        env:
          TO: ${{ github.event.inputs.to }}
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          [[ "$TO" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "::error::Not an email address"; exit 1; }
          m=""; [ -z "$HOST" ] && m="$m HOSTINGER_SSH_HOST"; [ -z "$USER" ] && m="$m HOSTINGER_SSH_USER"; [ -z "$KEY" ] && m="$m HOSTINGER_SSH_KEY"
          if [ -n "$m" ]; then echo "::error::Missing settings:$m"; exit 1; fi
      - name: Email DNS (SPF, DMARC, MX)
        id: dns
        run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          if ops/launch-checks.sh studymedicineuknigeria.com > dns.txt 2>&1; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; fi
          grep -E '^(ok|MISS) +(MX|SPF|DMARC|DKIM|no )' dns.txt || true
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.HOSTINGER_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_hostinger && chmod 600 ~/.ssh/id_hostinger
          # Pin the server key when HOSTINGER_SSH_KNOWN_HOSTS is set (recommended); otherwise trust on first use.
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; echo "SSH_STRICT=yes" >> "$GITHUB_ENV"; else ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
      - name: Send the test message
        env:
          TARGET: ${{ github.event.inputs.target }}
          TO: ${{ github.event.inputs.to }}
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
        run: |
          { printf 'export %s=%q\n' TARGET "$TARGET" TO "$TO"
            cat <<'REMOTE'
          set -euo pipefail
          cd ~/apps/smukn-$TARGET/current
          PHP=""; for c in php83 php8.3 /opt/alt/php83/usr/bin/php php; do p=$(command -v "$c" 2>/dev/null) && "$p" -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);' && { PHP=$p; break; }; done
          [ -n "$PHP" ] || { echo "no PHP 8.3+ command-line binary found"; exit 3; }
          $PHP artisan smukn:mail-test "$TO"
          REMOTE
          } | ssh -i ~/.ssh/id_hostinger -o StrictHostKeyChecking=${SSH_STRICT:-accept-new} -o ConnectTimeout=20 -p "$PORT" "$USER@$HOST" 'bash -s'
      - name: Open or close student registration
        if: ${{ github.event.inputs.registration != 'unchanged' }}
        env:
          TARGET: ${{ github.event.inputs.target }}
          WANT: ${{ github.event.inputs.registration }}
          DNS_READY: ${{ steps.dns.outputs.ready }}
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
        run: |
          if [ "$WANT" = open ] && [ "$TARGET" = production ] && [ "$DNS_READY" != yes ]; then echo "::error::email DNS is not ready (see the DNS step): registration stays closed"; exit 1; fi
          VALUE=$([ "$WANT" = open ] && echo true || echo false)
          { printf 'export %s=%q\n' TARGET "$TARGET" SITE_REGISTRATION_OPEN "$VALUE"; cat ops/update-env.sh; } | \
            ssh -i ~/.ssh/id_hostinger -o StrictHostKeyChecking=${SSH_STRICT:-accept-new} -o ConnectTimeout=20 -p "$PORT" "$USER@$HOST" 'bash -s'
          echo "### Student registration on $TARGET: $([ "$VALUE" = true ] && echo open || echo closed)" >> "$GITHUB_STEP_SUMMARY"
