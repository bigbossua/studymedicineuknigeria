name: Performance check (Lighthouse, read-only)
# Lighthouse (mobile emulation, Slow 4G and 4x CPU throttling, the default lab profile) on the pages a Nigerian searcher
# lands on most, against the live site. Reports the performance, accessibility, best-practice and SEO scores with LCP,
# CLS and TBT. Public URLs only; no secret is used. Lab figures are a regression signal, not field (CrUX) data.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 1'   # weekly, Monday

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Run Lighthouse
        run: |
          set -o pipefail
          npm i -g lighthouse@12 >/dev/null 2>&1
          ops/qa/performance-check.sh https://studymedicineuknigeria.com | tee perf.txt
          { echo '### Lighthouse (mobile, lab)'; cat perf.txt; } >> "$GITHUB_STEP_SUMMARY"
