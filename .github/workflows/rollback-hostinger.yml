name: Roll back Hostinger release
# Repoints current to the previous release (code only) and smoke-tests the result. Production runs in the
# production environment, so its required reviewer approves a rollback just as they approve a deploy.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to roll back'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      restore_previous_site:
        description: 'Serve again the site that was live before the first launch (undoes the deploy cutover; the SMUKN release and database stay for a relaunch)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency: deploy-${{ github.event.inputs.target }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Check configuration
        env:
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          m=""; [ -z "$HOST" ] && m="$m HOSTINGER_SSH_HOST(variable)"; [ -z "$USER" ] && m="$m HOSTINGER_SSH_USER(variable)"; [ -z "$KEY" ] && m="$m HOSTINGER_SSH_KEY(secret)"
          if [ -n "$m" ]; then echo "::error::Missing settings:$m"; exit 1; fi
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.HOSTINGER_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_hostinger && chmod 600 ~/.ssh/id_hostinger
          # Pin the server key when HOSTINGER_SSH_KNOWN_HOSTS is set (recommended); otherwise trust on first use.
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; echo "SSH_STRICT=yes" >> "$GITHUB_ENV"; else ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
      - name: Roll back and smoke-test
        env:
          TARGET: ${{ github.event.inputs.target }}
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
          SITE_URL: ${{ github.event.inputs.target == 'production' && 'https://studymedicineuknigeria.com' || vars.STAGING_URL }}
          SMOKE_AUTH: ${{ github.event.inputs.target != 'production' && vars.STAGING_BASIC_USER != '' && format('{0}:{1}', vars.STAGING_BASIC_USER, secrets.STAGING_BASIC_PASSWORD) || '' }}
          RESTORE_PREVIOUS_SITE: ${{ github.event.inputs.restore_previous_site == 'true' && '1' || '0' }}
        run: |
          export SSH_OPTS="-i $HOME/.ssh/id_hostinger -o StrictHostKeyChecking=${SSH_STRICT:-accept-new}"
          ops/rollback.sh "$USER@$HOST" "$PORT" "$TARGET" "$SITE_URL"
