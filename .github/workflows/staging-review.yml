name: Review deployed site (pages, CSP, accessibility, indexing)
# Runs ops/qa/staging-review.cjs against STAGING_URL from a GitHub runner (the development session cannot reach the
# site): every sitemap page plus the funnel and sign-in pages on desktop and mobile. Called by "Deploy to Hostinger"
# after every successful staging deploy, or dispatched by hand. The report is kept as an artifact.
# Production (https://studymedicineuknigeria.com, no password) checks the opposite of staging: every sitemap page must
# be indexable with its own https canonical and snippet-length title and description.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Site to review'
        type: choice
        options: [staging, production]
        default: staging
  workflow_call:
    inputs:
      target:
        type: string
        default: staging

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      BASE: ${{ (inputs.target || 'staging') == 'production' && 'https://studymedicineuknigeria.com' || vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Check configuration
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          SBU: ${{ vars.STAGING_BASIC_USER }}
          SBP: ${{ secrets.STAGING_BASIC_PASSWORD }}
        run: |
          [ "$TARGET" = production ] && exit 0
          m=""; [ -z "$STAGING_URL" ] && m="$m STAGING_URL(variable)"; [ -z "$SBU" ] && m="$m STAGING_BASIC_USER(variable)"; [ -z "$SBP" ] && m="$m STAGING_BASIC_PASSWORD(secret)"
          if [ -n "$m" ]; then echo "::error::Missing settings:$m"; exit 1; fi
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Install the browser and axe-core
        run: npm i -g playwright@1 axe-core@4 && npx -y playwright@1 install --with-deps chromium
      - name: Smoke test
        env:
          SMOKE_AUTH: ${{ (inputs.target || 'staging') != 'production' && format('{0}:{1}', vars.STAGING_BASIC_USER, secrets.STAGING_BASIC_PASSWORD) || '' }}
        run: ops/smoke.sh "$BASE" "$TARGET"
      - name: Page review (desktop and mobile)
        env:
          BASIC_USER: ${{ (inputs.target || 'staging') != 'production' && vars.STAGING_BASIC_USER || '' }}
          BASIC_PASS: ${{ (inputs.target || 'staging') != 'production' && secrets.STAGING_BASIC_PASSWORD || '' }}
        run: node ops/qa/staging-review.cjs out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.TARGET }}-review
          path: out/
          retention-days: 14
