name: Review staging (pages, CSP, accessibility, noindex)
# Runs ops/qa/staging-review.cjs against STAGING_URL from a GitHub runner (the development session cannot reach the
# site): every sitemap page plus the funnel and sign-in pages on desktop and mobile. Called by "Deploy to Hostinger"
# after every successful staging deploy, or dispatched by hand. The report is kept as an artifact.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check configuration
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          SBU: ${{ vars.STAGING_BASIC_USER }}
          SBP: ${{ secrets.STAGING_BASIC_PASSWORD }}
        run: |
          m=""; [ -z "$STAGING_URL" ] && m="$m STAGING_URL(variable)"; [ -z "$SBU" ] && m="$m STAGING_BASIC_USER(variable)"; [ -z "$SBP" ] && m="$m STAGING_BASIC_PASSWORD(secret)"
          if [ -n "$m" ]; then echo "::error::Missing settings:$m"; exit 1; fi
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Install the browser and axe-core
        run: npm i -g playwright@1 axe-core@4 && npx -y playwright@1 install --with-deps chromium
      - name: Smoke test
        env:
          SMOKE_AUTH: ${{ format('{0}:{1}', vars.STAGING_BASIC_USER, secrets.STAGING_BASIC_PASSWORD) }}
        run: ops/smoke.sh "${{ vars.STAGING_URL }}" staging
      - name: Page review (desktop and mobile)
        env:
          BASE: ${{ vars.STAGING_URL }}
          BASIC_USER: ${{ vars.STAGING_BASIC_USER }}
          BASIC_PASS: ${{ secrets.STAGING_BASIC_PASSWORD }}
          TARGET: staging
        run: node ops/qa/staging-review.cjs out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: staging-review
          path: out/
          retention-days: 14
