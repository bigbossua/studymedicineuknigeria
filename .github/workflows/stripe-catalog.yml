name: Stripe catalogue (products and prices)
# Creates or checks the three Stripe products (smukn_t1..t3) and their one-time GBP prices from the service price
# records, using the STRIPE_SECRET of the chosen environment: staging = Stripe test mode, production = live mode (the
# app refuses the wrong mode). Idempotent: products are found by id and prices by lookup key before anything is created,
# so repeated runs never duplicate them; no Payment Links are created. Prints ids and amounts only, never a key.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment whose Stripe key to use (staging = test mode, production = live mode)'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      mode:
        description: 'check = read only; create = create what is missing'
        required: true
        default: check
        type: choice
        options: [check, create]
      webhook:
        description: 'Webhook endpoint for this target: check, or create (needs the bootstrapped server: the signing secret goes straight into its .env, never into a log)'
        required: true
        default: check
        type: choice
        options: [check, create]

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Check configuration
        env:
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
        run: |
          [ -n "$STRIPE_SECRET" ] || { echo "::error::No STRIPE_SECRET in the '${{ github.event.inputs.target }}' environment (Settings → Environments → ${{ github.event.inputs.target }} → secrets)"; exit 1; }
          case "$STRIPE_SECRET" in sk_live_*|rk_live_*) live=1;; *) live=0;; esac
          if [ "${{ github.event.inputs.target }}" = production ] && [ "$live" = 0 ]; then echo "::error::production takes a live key only"; exit 1; fi
          if [ "${{ github.event.inputs.target }}" != production ] && [ "$live" = 1 ]; then echo "::error::staging takes a test key only"; exit 1; fi
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'mbstring, intl, bcmath', coverage: none }
      - name: Prepare the price records (the repository's approved fees)
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress
          cp .env.example .env && php artisan key:generate
          touch database/database.sqlite && php artisan migrate --force && php artisan smukn:reference-sync
      - name: Sync with Stripe
        env:
          APP_ENV: ${{ github.event.inputs.target == 'production' && 'production' || 'staging' }}
          APP_DEBUG: 'false'
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
        run: |
          set -o pipefail
          php artisan smukn:stripe-sync ${{ github.event.inputs.mode == 'check' && '--check' || '' }} | tee out.txt
          { echo '### Stripe catalogue (${{ github.event.inputs.target }}, ${{ github.event.inputs.mode }})'; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Webhook endpoint
        env:
          APP_ENV: ${{ github.event.inputs.target == 'production' && 'production' || 'staging' }}
          APP_DEBUG: 'false'
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          SITE_URL: ${{ github.event.inputs.target == 'production' && 'https://studymedicineuknigeria.com' || vars.STAGING_URL }}
          HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          PORT: ${{ vars.HOSTINGER_SSH_PORT || '65002' }}
          USER: ${{ vars.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          set -o pipefail   # the command's own exit status decides, not tee's
          [ -n "$SITE_URL" ] || { echo "::error::no site URL for ${{ github.event.inputs.target }} (STAGING_URL variable)"; exit 1; }
          URL="${SITE_URL%/}/webhooks/stripe"
          if php artisan smukn:stripe-webhook --url "$URL" | tee webhook.txt; then :; elif [ "${{ github.event.inputs.webhook }}" = create ] && grep -q 'No .*webhook endpoint' webhook.txt; then
            [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ] || { echo "::error::creating the endpoint needs the server settings: its signing secret is shown once and must go straight into the server's .env"; exit 1; }
            install -d -m 700 ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/id_hostinger; chmod 600 ~/.ssh/id_hostinger
            if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; STRICT=yes; else ssh-keyscan -p "$PORT" -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; STRICT=accept-new; fi
            SECRET_FILE=$(mktemp); trap 'rm -f "$SECRET_FILE"' EXIT
            php artisan smukn:stripe-webhook --url "$URL" --create --secret-file "$SECRET_FILE" | tee -a webhook.txt
            echo "::add-mask::$(cat "$SECRET_FILE")"
            # the secret travels on stdin as an export (ops/update-env.sh), never on a command line or in the log
            { printf 'export TARGET=%q\n' "${{ github.event.inputs.target }}"; printf 'export STRIPE_WEBHOOK_SECRET=%q\n' "$(cat "$SECRET_FILE")"; cat ops/update-env.sh; } | \
              ssh -i ~/.ssh/id_hostinger -o StrictHostKeyChecking=$STRICT -o ConnectTimeout=20 -p "$PORT" "$USER@$HOST" 'bash -s' | tee -a webhook.txt
            php artisan smukn:stripe-webhook --url "$URL" | tee -a webhook.txt
          else
            { echo '### Webhook endpoint'; echo '```'; cat webhook.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          { echo '### Webhook endpoint'; echo '```'; cat webhook.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
