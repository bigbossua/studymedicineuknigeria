name: Uptime check

# £0 monitoring: every 30 minutes run the smoke tests against the live site and keep one open
# issue while it is failing. Does nothing until the repository variable PRODUCTION_URL is set
# (after the first production deployment).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-check
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ vars.PRODUCTION_URL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip until PRODUCTION_URL is configured
        if: ${{ env.URL == '' }}
        run: echo "::notice::PRODUCTION_URL variable not set; nothing to check yet."
      - name: Smoke test
        id: smoke
        if: ${{ env.URL != '' }}
        continue-on-error: true
        run: bash ops/smoke.sh "$URL" | tee smoke.log
      - name: Open or update the incident issue on failure
        if: ${{ env.URL != '' && steps.smoke.outcome == 'failure' }}
        run: |
          title="Uptime check failing for $URL"
          body=$(printf 'The scheduled smoke test failed at %s UTC.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n\nThis issue closes itself when the next check passes.' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(cat smoke.log)" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")
          existing=$(gh issue list --label uptime --state open --search "$title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh label create uptime --color B60205 --description "Site availability incidents" 2>/dev/null || true; gh issue create --title "$title" --label uptime --body "$body"; fi
          exit 1
      - name: Close the incident issue when healthy again
        if: ${{ env.URL != '' && steps.smoke.outcome == 'success' }}
        run: |
          for n in $(gh issue list --label uptime --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Smoke test passed again at $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC (run $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
          done
